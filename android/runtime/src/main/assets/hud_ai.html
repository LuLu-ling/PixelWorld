<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Pixel World AI</title>
<style>
  /* 半透明底，气泡、按钮和输入框用白色细边框，后面透出游戏画面 */
  :root {
    --glass: rgba(24, 24, 24, .46);
    --fill: rgba(255, 255, 255, .10);
    --fill-strong: rgba(255, 255, 255, .20);
    --border: rgba(255, 255, 255, .88);
    --text: #ffffff;
    --muted: rgba(255, 255, 255, .74);
    --faint: rgba(255, 255, 255, .56);
    --line: rgba(255, 255, 255, .22);
    --error: #ffb4ab;
    --ime: 0px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: transparent; color: var(--text);
    font-family: system-ui, "Noto Sans SC", "Microsoft YaHei", sans-serif;
    font-size: 13px; -webkit-font-smoothing: antialiased;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .35);
  }
  button, textarea { font: inherit; color: inherit; text-shadow: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }

  #backdrop {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .10);
    padding: 8px 8px calc(8px + var(--ime));
  }
  .window {
    position: relative; display: flex; overflow: hidden;
    width: min(940px, 100%); height: 100%;
    max-width: 100%; max-height: 100%;
    background: var(--glass);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    border-radius: 14px;
  }

  /* 白色细边框、半透明填充 */
  .outline { background: var(--fill); border: 1px solid var(--border); }

  /* 历史对话 */
  .sidebar {
    width: 210px; flex: 0 0 210px; min-width: 0;
    display: flex; flex-direction: column;
    border-right: 1px solid var(--line);
  }
  .window.no-side .sidebar { display: none; }
  .side-head { display: flex; align-items: center; gap: 6px; padding: 10px 10px 6px 14px; }
  .side-head b { flex: 1; font-size: 12px; color: var(--muted); font-weight: 600; }
  .list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .item {
    display: block; width: 100%; text-align: left; padding: 8px 10px; margin: 3px 0;
    border-radius: 9px; color: var(--text); border: 1px solid transparent;
  }
  .item.active { background: var(--fill); border-color: var(--border); }
  .item .t { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
  .item .d { display: flex; gap: 8px; margin-top: 2px; font-size: 11px; color: var(--faint); }
  .item .del { margin-left: auto; color: var(--muted); padding: 0 2px; }
  .item .del.confirm { color: var(--error); }
  .list .none { padding: 10px; color: var(--faint); font-size: 12px; line-height: 1.6; }

  /* 主区域 */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .head {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 8px 6px 8px; min-height: 46px;
  }
  .head .title { flex: 1; min-width: 0; padding: 0 4px; }
  .head .title .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; font-weight: 600; }
  .head .title .s { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; color: var(--faint); }
  .btn {
    height: 32px; padding: 0 12px; border-radius: 9px; white-space: nowrap;
    color: var(--text); font-size: 12.5px;
    background: var(--fill); border: 1px solid var(--border);
  }
  .btn:active, .suggest button:active, .item:active { background: var(--fill-strong); }
  .btn.icon { width: 32px; padding: 0; font-size: 16px; line-height: 1; }
  .btn:disabled { opacity: .4; }
  body.ime .head .title .s { display: none; }

  .messages { flex: 1; overflow-y: auto; padding: 4px 12px 8px; overscroll-behavior: contain; }
  .msg { margin: 0 0 8px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .card {
    background: var(--fill); border: 1px solid var(--border); border-radius: 12px; padding: 9px 12px;
    line-height: 1.65; overflow-wrap: anywhere; min-width: 0;
  }
  .msg.user .card { max-width: 78%; white-space: pre-wrap; background: var(--fill-strong); }
  .msg.assistant .card { width: 100%; }
  .card .foot { display: flex; gap: 6px; margin: 8px 0 0; }
  .card .foot .btn { height: 26px; padding: 0 10px; font-size: 11.5px; }
  .card .state { color: var(--muted); font-size: 12px; }
  .notice {
    margin: 0 0 8px; padding: 8px 12px; border-radius: 12px;
    background: var(--fill); border: 1px solid var(--error);
    color: var(--error); font-size: 12px; line-height: 1.6; display: flex; align-items: center; gap: 8px;
  }
  .notice span { flex: 1; }

  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 8px; }
  .md h1, .md h2, .md h3 { margin: 12px 0 6px; line-height: 1.35; font-size: 14px; }
  .md ul, .md ol { margin: 4px 0 8px; padding-left: 20px; }
  .md li { margin: 2px 0; }
  .md code { padding: 1px 4px; border-radius: 4px; background: rgba(0, 0, 0, .28); font-family: ui-monospace, monospace; font-size: .92em; }
  .md pre { margin: 8px 0; padding: 8px 10px; overflow-x: auto; border-radius: 8px; background: rgba(0, 0, 0, .30); border: 1px solid var(--line); }
  .md pre code { padding: 0; background: none; font-size: 11.5px; line-height: 1.5; }
  .md blockquote { margin: 8px 0; padding: 2px 0 2px 10px; border-left: 2px solid var(--border); color: var(--muted); }
  .md a { color: var(--text); text-decoration: underline; }
  .md table { border-collapse: collapse; margin: 8px 0; font-size: 12px; }
  .md th, .md td { border: 1px solid var(--line); padding: 4px 7px; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }

  .empty { padding: 18px 6px; }
  .empty h1 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
  .empty p { margin: 0 0 14px; color: var(--muted); font-size: 12px; line-height: 1.6; }
  .suggest { display: flex; flex-direction: column; gap: 6px; max-width: 420px; }
  .suggest button { text-align: left; padding: 9px 12px; border-radius: 12px; background: var(--fill); border: 1px solid var(--border); }

  .composer { padding: 6px 12px 10px; }
  .box {
    display: flex; align-items: flex-end; gap: 6px;
    background: var(--fill); border: 1px solid var(--border); border-radius: 12px; padding: 5px 5px 5px 12px;
  }
  #input {
    flex: 1; min-height: 30px; max-height: 92px; resize: none; padding: 6px 0;
    border: 0; outline: 0; background: transparent; color: var(--text); font-size: 13px; line-height: 1.5;
  }
  #input::placeholder { color: var(--faint); }
  #send {
    height: 30px; padding: 0 14px; border-radius: 9px; font-size: 12.5px;
    background: var(--fill-strong); border: 1px solid var(--border); color: var(--text);
  }
  #send:disabled { opacity: .4; }
  #send.stop { border-color: var(--error); color: var(--error); }
  .hint { margin: 5px 2px 0; color: var(--faint); font-size: 11px; }
  body.ime .hint { display: none; }

  /* 右下角拖动缩放；触摸区域比看到的角标大，手指容易按到。双击恢复默认大小 */
  #resize {
    position: absolute; right: 0; bottom: 0; width: 34px; height: 34px; z-index: 5;
    touch-action: none; cursor: nwse-resize;
  }
  #resize::after {
    content: ""; position: absolute; right: 6px; bottom: 6px; width: 10px; height: 10px;
    border-right: 2px solid var(--border); border-bottom: 2px solid var(--border);
    border-bottom-right-radius: 4px; opacity: .8;
  }
  #resize.active::after { opacity: 1; }
  .window.resizing { outline: 1px solid var(--border); }

  .list::-webkit-scrollbar, .messages::-webkit-scrollbar { width: 4px; }
  .list::-webkit-scrollbar-thumb, .messages::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body>
<div id="backdrop">
  <section class="window" id="window">
    <aside class="sidebar">
      <div class="side-head">
        <b>对话记录</b>
        <button class="btn" id="newChat">新对话</button>
      </div>
      <div class="list" id="list"></div>
    </aside>

    <main class="main">
      <header class="head">
        <button class="btn icon" id="toggleSide" title="对话记录">☰</button>
        <div class="title">
          <div class="t" id="title">新对话</div>
          <div class="s" id="sub">和启动器的「AI」页同步</div>
        </div>
        <button class="btn" id="openLauncher">在启动器中打开</button>
        <button class="btn icon" id="close" title="关闭">✕</button>
      </header>

      <div class="messages" id="messages"></div>

      <div class="composer">
        <div class="box">
          <textarea id="input" rows="1" placeholder="输入问题"></textarea>
          <button id="send">发送</button>
        </div>
        <div class="hint" id="hint">关闭窗口不会中断回答，回答会保存在启动器里</div>
      </div>
    </main>
    <div id="resize" title="拖动调整大小，双击恢复默认"></div>
  </section>
</div>

<script>/*MARKED_JS*/</script>
<script>
(function () {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const win = $("window");
  const listEl = $("list");
  const messagesEl = $("messages");
  const input = $("input");
  const sendBtn = $("send");

  let data = { sessions: [], currentId: "", messages: [], busy: false, loading: false,
               streaming: "", status: "", notice: "", instance: "" };
  let streamEl = null;
  let renderTimer = 0;
  let pendingDelete = "";
  let followBottom = true;

  function native(method, ...args) {
    try {
      const api = window.PclHudNative;
      if (api && typeof api[method] === "function") return api[method](...args);
    } catch (e) { /* 浏览器里预览时没有原生接口 */ }
    return null;
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function sanitize(html) {
    const t = document.createElement("template");
    t.innerHTML = html;
    t.content.querySelectorAll("script,iframe,object,embed,style,link,meta,form,input,button,textarea,img").forEach((n) => n.remove());
    t.content.querySelectorAll("*").forEach((n) => {
      for (const a of Array.from(n.attributes)) {
        const name = a.name.toLowerCase();
        if (name.startsWith("on") || name === "srcdoc" || name === "style") n.removeAttribute(a.name);
        if ((name === "href" || name === "src") && /^\s*javascript:/i.test(a.value)) n.removeAttribute(a.name);
      }
    });
    return t.innerHTML;
  }

  function markdown(text) {
    if (window.marked) {
      try { return sanitize(window.marked.parse(String(text || ""), { gfm: true, breaks: true })); }
      catch (e) { /* 落到纯文本 */ }
    }
    return esc(text).replace(/\n/g, "<br>");
  }

  function when(ts) {
    if (!ts) return "";
    const d = Date.now() - Number(ts);
    if (d < 60000) return "刚刚";
    if (d < 3600000) return Math.floor(d / 60000) + " 分钟前";
    if (d < 86400000) return Math.floor(d / 3600000) + " 小时前";
    const t = new Date(Number(ts));
    return (t.getMonth() + 1) + "月" + t.getDate() + "日";
  }

  function nearBottom() {
    return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 40;
  }
  function toBottom(force) {
    if (force || followBottom) messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  messagesEl.addEventListener("scroll", () => { followBottom = nearBottom(); });

  // ---------- 渲染 ----------

  function renderList() {
    listEl.innerHTML = "";
    if (!data.sessions.length) {
      listEl.innerHTML = '<div class="none">还没有对话。在这里或启动器的「AI」页提的问题都会显示在这里。</div>';
      return;
    }
    data.sessions.forEach((s) => {
      const item = document.createElement("button");
      item.className = "item" + (s.id === data.currentId ? " active" : "");
      const t = document.createElement("span");
      t.className = "t";
      t.textContent = s.title || "新对话";
      const d = document.createElement("span");
      d.className = "d";
      const time = document.createElement("span");
      time.textContent = s.busy ? "正在回答" : when(s.updated);
      d.appendChild(time);
      if (s.id === data.currentId) {
        const del = document.createElement("span");
        del.className = "del" + (pendingDelete === s.id ? " confirm" : "");
        del.textContent = pendingDelete === s.id ? "确认删除" : "删除";
        del.addEventListener("click", (e) => {
          e.stopPropagation();
          if (pendingDelete === s.id) { pendingDelete = ""; native("deleteSession", s.id); }
          else { pendingDelete = s.id; renderList(); }
        });
        d.appendChild(del);
      }
      item.appendChild(t);
      item.appendChild(d);
      item.addEventListener("click", () => {
        pendingDelete = "";
        native("selectSession", s.id);
        if (window.innerWidth < 640) setSide(false);
      });
      listEl.appendChild(item);
    });
  }

  function messageEl(role, content) {
    const row = document.createElement("div");
    row.className = "msg " + (role === "user" ? "user" : "assistant");
    const card = document.createElement("div");
    card.className = "card";
    if (role === "user") {
      card.textContent = content;
    } else {
      const md = document.createElement("div");
      md.className = "md";
      md.innerHTML = markdown(content);
      card.appendChild(md);
      const foot = document.createElement("div");
      foot.className = "foot";
      const copy = document.createElement("button");
      copy.className = "btn";
      copy.textContent = "复制";
      copy.addEventListener("click", () => native("copy", content));
      foot.appendChild(copy);
      card.appendChild(foot);
    }
    row.appendChild(card);
    return row;
  }

  function renderEmpty() {
    const box = document.createElement("div");
    box.className = "empty";
    box.innerHTML = "<h1>有什么问题？</h1><p>可以问崩溃、模组和设置。提问时会附带当前游戏的状态" +
      "，需要时 AI 会自己查看日志。</p><div class=\"suggest\"></div>";
    const s = box.querySelector(".suggest");
    ["刚才卡了一下，帮我看看日志", "这个版本适合装哪些优化模组？", "游戏内存应该设置多少？"].forEach((q) => {
      const b = document.createElement("button");
      b.textContent = q;
      b.addEventListener("click", () => { input.value = q; send(); });
      s.appendChild(b);
    });
    messagesEl.appendChild(box);
  }

  function renderStream() {
    renderTimer = 0;
    if (!data.busy) return;
    if (!streamEl) {
      streamEl = document.createElement("div");
      streamEl.className = "msg assistant";
      streamEl.innerHTML = '<div class="card"><div class="md"></div><div class="state"></div></div>';
      messagesEl.appendChild(streamEl);
    }
    streamEl.querySelector(".md").innerHTML = data.streaming ? markdown(data.streaming) : "";
    streamEl.querySelector(".state").textContent = data.status || "正在回答…";
    streamEl.querySelector(".state").style.marginTop = data.streaming ? "6px" : "0";
    toBottom();
  }

  function renderMessages() {
    messagesEl.innerHTML = "";
    streamEl = null;
    if (data.loading && !data.messages.length) {
      const p = document.createElement("div");
      p.className = "empty";
      p.innerHTML = '<p>正在读取…</p>';
      messagesEl.appendChild(p);
    } else if (!data.messages.length && !data.busy) {
      renderEmpty();
    }
    data.messages.forEach((m) => messagesEl.appendChild(messageEl(m.role, m.content)));
    if (data.notice) {
      const n = document.createElement("div");
      n.className = "notice";
      n.innerHTML = "<span></span>";
      n.firstChild.textContent = data.notice;
      const retry = document.createElement("button");
      retry.className = "btn";
      retry.textContent = "重新连接";
      retry.addEventListener("click", () => native("reload"));
      n.appendChild(retry);
      messagesEl.appendChild(n);
    }
    renderStream();
    toBottom(true);
    followBottom = true;
  }

  function renderHead() {
    const cur = data.sessions.find((s) => s.id === data.currentId);
    $("title").textContent = cur ? (cur.title || "新对话") : "新对话";
    $("sub").textContent = (data.instance ? data.instance + " · " : "") + "和启动器的「AI」页同步";
    sendBtn.textContent = data.busy ? "停止" : "发送";
    sendBtn.classList.toggle("stop", data.busy);
    $("newChat").disabled = data.busy;
  }

  // ---------- 原生调用 ----------

  window.PclHud = {
    state(json) {
      try { data = Object.assign(data, JSON.parse(json)); } catch (e) { return; }
      renderHead();
      renderList();
      renderMessages();
    },
    stream(text) {
      data.streaming = String(text || "");
      if (!renderTimer) renderTimer = setTimeout(renderStream, 50);
    },
    status(text) {
      data.status = String(text || "");
      if (streamEl) streamEl.querySelector(".state").textContent = data.status || "正在回答…";
    },
    restore(text) {
      if (!input.value) { input.value = String(text || ""); grow(); }
    },
    ime(px) {
      const v = Math.max(0, Number(px) || 0);
      document.documentElement.style.setProperty("--ime", v + "px");
      document.body.classList.toggle("ime", v > 0);
      if (v > 0) toBottom(true);
    }
  };

  // ---------- 交互 ----------

  function send() {
    if (data.busy) { native("stop"); return; }
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    grow();
    native("ask", text);
  }

  function grow() {
    input.style.height = "auto";
    input.style.height = Math.min(92, input.scrollHeight) + "px";
  }

  function setSide(show) {
    win.classList.toggle("no-side", !show);
    try { localStorage.setItem("pclpw.hud.ai.side", show ? "1" : "0"); } catch (e) {}
  }

  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  input.addEventListener("input", grow);
  $("newChat").addEventListener("click", () => {
    native("newSession");
    if (window.innerWidth < 640) setSide(false);
    input.focus();
  });
  $("toggleSide").addEventListener("click", () => setSide(win.classList.contains("no-side")));
  $("openLauncher").addEventListener("click", () => native("openLauncher"));
  $("close").addEventListener("click", () => native("close"));
  $("backdrop").addEventListener("click", (e) => { if (e.target.id === "backdrop") native("close"); });
  window.addEventListener("keydown", (e) => { if (e.key === "Escape") native("close"); });

  try {
    const side = localStorage.getItem("pclpw.hud.ai.side");
    setSide(side === null ? window.innerWidth >= 640 : side === "1");
  } catch (e) { setSide(window.innerWidth >= 640); }

  // ---------- 拖动右下角缩放 ----------
  // 窗口居中显示，所以宽高按手指移动距离的两倍变化，角标正好跟着手指走
  const handle = $("resize");
  const SIZE_KEY = "pclpw.hud.ai.size";
  let drag = null;
  let saved = null;

  function bounds() {
    const area = $("backdrop").getBoundingClientRect();
    const maxW = Math.max(300, area.width - 16);
    const maxH = Math.max(200, area.height - 16 - (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--ime")) || 0));
    return { minW: Math.min(360, maxW), minH: Math.min(240, maxH), maxW, maxH };
  }
  function applySize(w, h) {
    const b = bounds();
    win.style.width = Math.round(Math.max(b.minW, Math.min(b.maxW, w))) + "px";
    win.style.height = Math.round(Math.max(b.minH, Math.min(b.maxH, h))) + "px";
  }
  function resetSize() {
    saved = null;
    win.style.width = "";
    win.style.height = "";
    try { localStorage.removeItem(SIZE_KEY); } catch (e) {}
  }
  handle.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    const r = win.getBoundingClientRect();
    drag = { x: e.clientX, y: e.clientY, w: r.width, h: r.height, id: e.pointerId };
    handle.setPointerCapture(e.pointerId);
    handle.classList.add("active");
    win.classList.add("resizing");
  });
  handle.addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    applySize(drag.w + (e.clientX - drag.x) * 2, drag.h + (e.clientY - drag.y) * 2);
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    drag = null;
    handle.classList.remove("active");
    win.classList.remove("resizing");
    try { handle.releasePointerCapture(e.pointerId); } catch (err) {}
    const r = win.getBoundingClientRect();
    saved = { w: r.width, h: r.height };
    try { localStorage.setItem(SIZE_KEY, JSON.stringify(saved)); } catch (err) {}
  }
  handle.addEventListener("pointerup", endDrag);
  handle.addEventListener("pointercancel", endDrag);
  handle.addEventListener("dblclick", resetSize);
  // 旋转屏幕或键盘弹出时保持在可见范围内
  window.addEventListener("resize", () => { if (saved) applySize(saved.w, saved.h); });
  try {
    const raw = localStorage.getItem(SIZE_KEY);
    if (raw) { saved = JSON.parse(raw); applySize(saved.w, saved.h); }
  } catch (e) { saved = null; }

  renderHead();
  renderList();
  renderMessages();
  native("ready");
})();
</script>
</body>
</html>
