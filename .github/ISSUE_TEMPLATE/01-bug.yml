name: 启动器 Bug
description: 启动器功能、界面、下载、更新、安卓端等出现问题。
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先看看[使用文档](https://pcl.pw.zhuzhi.site/docs/)和[已有 Issues](https://github.com/zhuzhi-09/PCL.PW/issues?q=is%3Aissue+)，并确认用的是最新版本。
        请尽量把问题写清楚；缺少日志或复现步骤时，可能无法定位，Issue 会被直接关闭。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      description: 请逐项确认；必需项没有勾选时，Issue 可能被直接关闭。
      options:
        - label: 我已经搜索过 [Issues](https://github.com/zhuzhi-09/PCL.PW/issues?q=is%3Aissue+)，没有找到相同的问题。
          required: true
        - label: 我使用的是最新版本（正式版或 Nightly），不是旧版本。
          required: true
        - label: 我能在最新版本上复现这个问题；暂时无法复现的部分已经在下面说明。
          required: true
        - label: 我附上了日志或截图，并确认内容是真实的，没有提交未经验证的 AI 生成内容。
          required: true

  - type: dropdown
    id: ai-usage
    attributes:
      label: AI 使用情况
      description: 使用生成式 AI 写这个 Issue 不是违规，但需要说明，并自行核对内容。
      options:
        - 未使用
        - 仅用于翻译或润色
        - 用于分析、起草或整理，已人工核对
    validations:
      required: true

  - type: textarea
    id: ai-details
    attributes:
      label: AI 工具与核对方式
      description: 使用了 AI 时填写工具、模型和用途；未使用填「无」。
      placeholder: |
        工具与模型：
        用途：
        核对方式：
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 系统
      options:
        - Windows
        - Android
        - macOS
        - Linux
        - 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 启动器版本
      description: 在「设置 → 关于」或关于页查看；Nightly 请写提交号。
      placeholder: 例如 0.3.4，或 Nightly 8fc9de8
    validations:
      required: true

  - type: dropdown
    id: channel
    attributes:
      label: 更新通道
      options:
        - 正式版
        - Nightly
        - 自己编译
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 问题类型
      description: 选一个最接近的；不确定时选「其他」。
      options:
        - 启动器界面 / 交互
        - 版本安装与下载
        - Java / 内存
        - 模组与加载器
        - 游戏启动
        - 游戏内叠加层 / 助手
        - AI / 文档
        - 更新与安装包
        - 性能 / 崩溃
        - 其他
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 具体发生了什么？写清楚在哪个页面、点了什么、看到了什么。
      placeholder: 我在……页面点击……后，出现了……
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序写出能重现问题的最少步骤。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你原本以为会发生什么？
      placeholder: 我期望……
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: 从「设置 → 关于 → 导出日志」导出 ZIP；截图或录屏也可以直接拖进来。日志缺失时可能无法定位问题。
      placeholder: 点击这里后把文件拖进来，或粘贴关键报错。
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 模组列表、整合包、最近改过的设置、是否使用 AI 等。
      placeholder: 其他可能有用的信息……
    validations:
      required: false
