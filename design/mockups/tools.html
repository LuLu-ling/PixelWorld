<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工具效果图</title>
<link rel="stylesheet" href="base.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tile { display: flex; align-items: center; gap: 12px; min-height: 76px; padding: 12px 14px; border-radius: 14px; background: var(--surface); cursor: pointer; }
  .tile .ti { width: 42px; height: 42px; border-radius: 11px; background: var(--primary-c); color: var(--on-primary-c); display: grid; place-items: center; flex: none; }
  .tile .t { font-size: 14px; font-weight: 600; }
  .tile .s { font-size: 11.5px; color: var(--faint); margin-top: 2px; }
  .sec { font-size: 12px; color: var(--muted); margin: 2px 2px 0; }
</style>
</head>
<body>
<div class="page">
  <div class="phone" id="phone">
    <div class="cutout"></div>
    <div class="app">
      <aside class="rail">
        <img class="logo" src="logo.png" alt="">
        <div class="nav" data-href="index.html"><div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>启动</div>
        <div class="nav" data-href="download.html"><div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg></div>下载</div>
        <div class="nav on" data-href="tools.html"><div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 7l3-3 3 3-3 3M4 20l9-9M7 4l3 3-3 3-3-3z"/></svg></div>工具</div>
        <div class="nav" data-href="settings.html"><div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></div>设置</div>
        <div class="nav" data-href="ai.html"><div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H9l-5 4z"/></svg></div>AI</div>
      </aside>
      <main class="main">
        <div class="top">
          <div class="hi">工具</div>
          <div class="tasks" id="tasks"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg><span class="label">当前无后台任务</span></div>
          <div class="icon-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 16V11a6 6 0 1112 0v5l2 2H4zM10 21h4"/></svg></div>
          <div class="status">80%</div>
          <div class="chip-acc"><div class="avatar">Z</div>zhuzhi · 离线</div>
        </div>
        <div class="pane" style="display:flex;flex-direction:column;gap:8px">
          <div class="sec">游戏</div>
          <div class="grid">
            <div class="tile"><div class="ti"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16M14 6l6 6-6 6M10 18l-6-6"/></svg></div><div><div class="t">局域网互传</div><div class="s">在两台设备之间传模组、存档、整个版本</div></div></div>
            <div class="tile"><div class="ti"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l4 4v14H6zM9 12h7M9 16h7"/></svg></div><div><div class="t">日志与崩溃分析</div><div class="s">查看游戏日志，自动找出崩溃原因</div></div></div>
            <div class="tile"><div class="ti"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h6l2 2h10v10H3z"/></svg></div><div><div class="t">文件管理</div><div class="s">浏览游戏文件夹、导入导出文件</div></div></div>
            <div class="tile"><div class="ti"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v6H4zM4 14h16v6H4z"/></svg></div><div><div class="t">导入整合包</div><div class="s">Modrinth、CurseForge、MCBBS 格式</div></div></div>
            <div class="tile"><div class="ti"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></div><div><div class="t">皮肤</div><div class="s">查看和下载正版玩家的皮肤</div></div></div>
            <div class="tile"><div class="ti"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h11l3 3v13H5zM9 9h6M9 13h6M9 17h4"/></svg></div><div><div class="t">使用文档</div><div class="s">在启动器里阅读官网文档</div></div></div>
          </div>
          <div class="sec">其他</div>
          <div class="grid">
            <div class="tile"><div class="ti"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h10"/></svg></div><div><div class="t">任务历史</div><div class="s">下载与安装记录</div></div></div>
            <div class="tile"><div class="ti"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h6v6H9z"/></svg></div><div><div class="t">百宝箱</div><div class="s">今日人品、随机种子等小工具</div></div></div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div class="note">三列大块按钮，每块 76 高，带一句说明；整块都能点。「任务历史」从侧栏移到这里，顶栏的后台任务也能直接进入。</div>
</div>
<script src="nav.js"></script>
</body>
</html>
