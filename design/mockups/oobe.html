<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首次设置模型</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #111412; --side: #0d100e; --surface: #1a1f1c; --surface-2: #222924; --surface-3: #2b332e;
    --primary: #8fd6a4; --on-primary: #0b3a1c; --primary-c: #2c5a3a; --on-primary-c: #c8f0d2;
    --text: #e3e8e3; --muted: #a3ada5; --faint: #6f7a72; --line: rgba(255,255,255,.07); --err: #ffb4ab;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0a0b0a; color: var(--text);
    font-family: system-ui, "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", sans-serif; }
  .page { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 16px 28px; }
  .bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .bar button { border: 1px solid #2b322d; background: #161a17; color: #c9d1ca; font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 999px; cursor: pointer; }
  .bar button.on { background: var(--primary-c); color: var(--on-primary-c); border-color: transparent; }
  .note { color: var(--faint); font-size: 12.5px; text-align: center; max-width: 980px; line-height: 1.7; }
  .stage { width: min(1100px, 100%); }
  svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- 外框：电脑窗口 1100×700，手机横屏 914×411，整体按页面宽度缩放 ---------- */
  .frame { position: relative; overflow: hidden; background: var(--bg); transform-origin: top left; font-size: 14px; }
  .frame.desktop { width: 1100px; height: 700px; border-radius: 10px; box-shadow: 0 0 0 1px #262b28, 0 30px 80px rgba(0,0,0,.6); }
  .frame.phone { width: 914px; height: 411px; border-radius: 26px; box-shadow: 0 0 0 8px #222, 0 20px 60px rgba(0,0,0,.6); font-size: 13px; }
  .cutout { position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; margin-top: -9px; border-radius: 50%; background: #000; z-index: 9; }
  .frame.desktop .cutout { display: none; }
  .winbtns { position: absolute; right: 0; top: 0; display: flex; z-index: 5; }
  .winbtns span { width: 46px; height: 32px; display: grid; place-items: center; color: var(--muted); font-size: 12px; }
  .frame.phone .winbtns { display: none; }

  .oobe { position: absolute; inset: 0; display: flex; }
  /* 左边：标志和步骤 */
  .side { width: 268px; flex: none; background: var(--side); display: flex; flex-direction: column; padding: 28px 18px 18px 26px; }
  .frame.phone .side { width: 214px; padding: 16px 12px 12px 46px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
  .frame.phone .brand { margin-bottom: 12px; }
  .brand img, .brand .cube { width: 38px; height: 38px; }
  .frame.phone .brand .cube { width: 30px; height: 30px; }
  .brand b { font-size: 17px; letter-spacing: .2px; }
  .brand small { display: block; color: var(--faint); font-size: 11.5px; font-weight: 400; margin-top: 1px; }
  .steps { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .step { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 10px; border-radius: 10px; color: var(--faint); font-size: 13.5px; cursor: pointer; }
  .frame.phone .step { height: 33px; font-size: 12.5px; gap: 8px; }
  .step .dot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; background: var(--surface-2); color: var(--muted); flex: none; }
  .frame.phone .step .dot { width: 20px; height: 20px; font-size: 10.5px; }
  .step .dot svg { width: 14px; height: 14px; stroke-width: 2.4; }
  .step.done { color: var(--muted); }
  .step.done .dot { background: var(--primary-c); color: var(--on-primary-c); }
  .step.on { color: var(--text); background: var(--surface); font-weight: 600; }
  .step.on .dot { background: var(--primary); color: var(--on-primary); }
  .step.locked { cursor: not-allowed; opacity: .55; }
  .skip { color: var(--faint); font-size: 12px; line-height: 1.6; padding: 0 10px; }
  .skip a { color: var(--primary); text-decoration: none; cursor: pointer; }
  .frame.phone .skip { display: none; }

  /* 右边：内容和底部按钮 */
  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 44px 56px 12px 48px; }
  .frame.phone .scroll { padding: 18px 28px 8px 26px; }
  .scroll::-webkit-scrollbar { width: 4px; } .scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 2px; }
  h1 { font-size: 26px; margin: 0 0 6px; font-weight: 750; }
  .frame.phone h1 { font-size: 20px; margin-bottom: 2px; }
  .lead { color: var(--muted); margin: 0 0 22px; line-height: 1.6; }
  .frame.phone .lead { margin-bottom: 12px; font-size: 12.5px; }
  .foot { flex: none; display: flex; align-items: center; gap: 10px; padding: 14px 56px 22px 48px; border-top: 1px solid var(--line); }
  .frame.phone .foot { padding: 8px 28px 10px 26px; }
  .foot .grow { flex: 1; }
  .foot .hint { color: var(--faint); font-size: 12px; }
  .progress { height: 3px; background: var(--surface-2); border-radius: 2px; overflow: hidden; margin-bottom: 20px; display: none; }
  .progress i { display: block; height: 100%; background: var(--primary); transition: width .25s; }

  .btn { height: 40px; padding: 0 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,.16); background: transparent; color: var(--text);
    font: inherit; font-size: 13.5px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; white-space: nowrap; }
  .frame.phone .btn { height: 36px; padding: 0 16px; font-size: 13px; }
  .btn.p { background: var(--primary); color: var(--on-primary); border-color: transparent; font-weight: 700; }
  .btn.t { background: var(--primary-c); color: var(--on-primary-c); border-color: transparent; }
  .btn.text { border-color: transparent; color: var(--primary); }
  .btn:disabled { opacity: .38; cursor: not-allowed; }

  /* 选项卡片 */
  .opts { display: grid; gap: 10px; }
  .opts.cols3 { grid-template-columns: repeat(3, 1fr); }
  .opts.cols2 { grid-template-columns: repeat(2, 1fr); }
  .opt { position: relative; border-radius: 14px; background: var(--surface); padding: 14px 16px 14px 48px; cursor: pointer; border: 1.5px solid transparent; line-height: 1.5; }
  .frame.phone .opt { padding: 9px 12px 9px 40px; border-radius: 12px; }
  .opt::before { content: ""; position: absolute; left: 16px; top: 16px; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--faint); }
  .frame.phone .opt::before { left: 13px; top: 11px; width: 15px; height: 15px; }
  .opt.on { border-color: var(--primary); background: color-mix(in srgb, var(--primary-c) 35%, var(--surface)); }
  .opt.on::before { border-color: var(--primary); background: radial-gradient(circle, var(--primary) 0 45%, transparent 50%); }
  .opt .t { font-weight: 650; display: flex; align-items: center; gap: 8px; }
  .opt .s { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .frame.phone .opt .s { font-size: 11.5px; }
  .tag { font-size: 10.5px; padding: 1px 7px; border-radius: 5px; background: var(--primary-c); color: var(--on-primary-c); font-weight: 600; }
  .tag.gray { background: var(--surface-3); color: var(--muted); }
  .opt .extra { margin-top: 10px; display: flex; gap: 8px; align-items: center; }
  .field { flex: 1; height: 38px; border-radius: 10px; background: var(--bg); border: 1px solid rgba(255,255,255,.12); color: var(--text); padding: 0 12px; font: inherit; font-size: 13px; }
  .frame.phone .field { height: 32px; }
  .path { flex: 1; height: 36px; border-radius: 10px; background: var(--bg); color: var(--muted); font-size: 12px; display: flex; align-items: center; padding: 0 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

  .group { border-radius: 14px; background: var(--surface); overflow: hidden; margin-bottom: 14px; }
  .row { display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
  .frame.phone .row { min-height: 46px; padding: 5px 12px; gap: 10px; }
  .row:last-child { border-bottom: 0; }
  .row .rt { flex: 1; min-width: 0; }
  .row .s { font-size: 12px; color: var(--faint); margin-top: 1px; }
  .seg { display: flex; border: 1px solid rgba(255,255,255,.16); border-radius: 20px; overflow: hidden; }
  .seg span { padding: 7px 14px; font-size: 12.5px; color: var(--muted); cursor: pointer; border-right: 1px solid rgba(255,255,255,.16); }
  .frame.phone .seg span { padding: 5px 10px; font-size: 12px; }
  .seg span:last-child { border-right: 0; }
  .seg span.on { background: var(--primary-c); color: var(--on-primary-c); }
  .swatches { display: flex; gap: 8px; }
  .sw { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; box-shadow: inset 0 0 0 2px rgba(0,0,0,.25); }
  .frame.phone .sw { width: 22px; height: 22px; }
  .sw.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text); }
  .gtitle { font-size: 12.5px; color: var(--muted); margin: 0 2px 8px; }

  /* 首页布局小预览 */
  .lay { border-radius: 14px; background: var(--surface); padding: 10px; cursor: pointer; border: 1.5px solid transparent; }
  .lay.on { border-color: var(--primary); }
  .lay .pv { height: 92px; border-radius: 8px; position: relative; overflow: hidden; background: var(--bg); }
  .frame.phone .lay .pv { height: 58px; }
  .lay .pv.wall { background: linear-gradient(135deg, #4a2a5a, #a0405a 55%, #e0a24a); }
  .lay .pv i { position: absolute; border-radius: 4px; background: var(--surface-3); }
  .lay .pv.wall i { background: rgba(20,16,24,.6); }
  .lay .pv i.g { background: var(--primary); }
  .lay .t { font-weight: 650; font-size: 13px; margin-top: 8px; }
  .lay .s { color: var(--faint); font-size: 11.5px; }
  .frame.phone .lay .s { display: none; }

  /* 协议 */
  .summary { border-radius: 14px; background: var(--primary-c); color: var(--on-primary-c); padding: 12px 16px; margin-bottom: 12px; line-height: 1.7; font-size: 13px; }
  .frame.phone .summary { padding: 8px 12px; font-size: 12px; margin-bottom: 8px; }
  .summary ul { margin: 0; padding-left: 18px; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); }
  .tabs span { padding: 9px 16px; font-size: 13px; color: var(--muted); cursor: pointer; position: relative; }
  .tabs span.on { color: var(--text); font-weight: 600; }
  .tabs span.on::after { content: ""; position: absolute; left: 16px; right: 16px; bottom: -1px; height: 2px; background: var(--primary); border-radius: 2px; }
  .legal { height: 250px; overflow-y: auto; background: var(--surface); border-radius: 0 0 14px 14px; padding: 12px 18px; font-size: 12.5px; line-height: 1.75; color: #cfd6d0; }
  .frame.phone .legal { height: 108px; padding: 8px 14px; }
  .legal h4 { margin: 10px 0 2px; font-size: 13px; color: var(--text); }
  .legal h4:first-child { margin-top: 0; }
  .check { display: flex; align-items: center; gap: 10px; margin-top: 14px; cursor: pointer; user-select: none; }
  .frame.phone .check { margin-top: 8px; }
  .box { width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--muted); display: grid; place-items: center; flex: none; }
  .check.on .box { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .box svg { width: 14px; height: 14px; stroke-width: 3; display: none; }
  .check.on .box svg { display: block; }

  /* 欢迎 / 完成 */
  .hero { display: flex; flex-direction: column; align-items: flex-start; padding-top: 30px; }
  .frame.phone .hero { padding-top: 4px; }
  .hero .cube { width: 96px; height: 96px; margin-bottom: 18px; }
  .frame.phone .hero .cube { width: 60px; height: 60px; margin-bottom: 8px; }
  .hero h1 { font-size: 32px; }
  .frame.phone .hero h1 { font-size: 22px; }
  .feats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 6px; width: 100%; }
  .feat { border-radius: 14px; background: var(--surface); padding: 14px; font-size: 12.5px; color: var(--muted); line-height: 1.55; }
  .frame.phone .feat { padding: 9px 10px; font-size: 11.5px; }
  .feat b { display: block; color: var(--text); font-size: 13.5px; margin: 6px 0 2px; }
  .frame.phone .feat b { font-size: 12.5px; margin-top: 3px; }
  .feat svg { color: var(--primary); }
  .lang { display: flex; align-items: center; gap: 10px; margin-top: 18px; color: var(--muted); font-size: 13px; }
  .frame.phone .lang { margin-top: 10px; }
  .select { height: 36px; border-radius: 10px; background: var(--surface); padding: 0 12px; display: flex; align-items: center; gap: 8px; color: var(--text); }
  .doneicon { width: 72px; height: 72px; border-radius: 50%; background: var(--primary-c); color: var(--primary); display: grid; place-items: center; margin-bottom: 16px; }
  .frame.phone .doneicon { width: 48px; height: 48px; margin-bottom: 8px; }
  .doneicon svg { width: 36px; height: 36px; stroke-width: 2.4; }
  .frame.phone .doneicon svg { width: 26px; height: 26px; }
  .sum { width: 100%; }
  .sum .row .k { width: 92px; color: var(--faint); font-size: 12.5px; flex: none; }
  .sum .row .v { flex: 1; font-size: 13px; }
  .sum .row a { color: var(--primary); font-size: 12.5px; cursor: pointer; }
  .acct { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .acct .opt { padding: 16px; padding-left: 16px; }
  .acct .opt::before { display: none; }
  .acct .ico { width: 36px; height: 36px; border-radius: 10px; background: var(--surface-3); display: grid; place-items: center; margin-bottom: 10px; color: var(--primary); }
  .frame.phone .acct .ico { width: 28px; height: 28px; margin-bottom: 5px; }
  .frame.phone .acct .opt { padding: 10px; }
  .added { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 14px; border-radius: 12px; background: var(--surface); }
  .avatar { width: 30px; height: 30px; border-radius: 8px; background: #3c7a50; display: grid; place-items: center; font-weight: 700; color: #fff; }
  .toast { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); background: #e3e8e3; color: #111; padding: 9px 16px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="page">
  <div class="bar">
    <button data-dev="desktop" class="on">电脑窗口</button>
    <button data-dev="phone">手机横屏</button>
  </div>
  <div class="note">首次设置（OOBE）模型：第一次打开启动器时全屏显示，走完再进入主界面，然后可以接着看新手教程。左边的步骤可以点回去改；同意协议之前后面的步骤是锁着的。<br>
    数据都是假的，按钮只演示流程。</div>
  <div class="stage" id="stage"></div>

const svg = (n) => `<svg viewBox="0 0 24 24">${I[n]}</svg>`;
const cube = () => document.getElementById('cube').innerHTML;

const S = {
  dev: 'desktop', step: 0, agreed: false, tab: 0, mode: 'system', color: 0, layout: 'standard', wall: false,
  folder: 'default', storage: 'shared', source: 'auto', account: null, offlineName: '', tour: true,
};
const STEPS = ['欢迎', '用户协议', '外观', '游戏文件夹', '下载', '账户', '完成'];
const COLORS = ['#2f6b4f', '#1471fd', '#6b4fc4', '#c2671f', '#c62828', '#0f7c80', '#b02a7a', '#7a6544'];

function stepsHtml() {
  return STEPS.map((t, i) => {
    const cls = i === S.step ? 'on' : i < S.step ? 'done' : '';
    const locked = i > 1 && !S.agreed ? ' locked' : '';
    const dot = i < S.step ? svg('check') : i + 1;
    return `<div class="step ${cls}${locked}" data-go="${i}"><span class="dot">${dot}</span>${t}</div>`;
  }).join('');
}

function legal() {
  return S.tab === 0 ? `
    <h4>1. 关于本软件</h4>Pixel World 是免费、开源的第三方 Minecraft 启动器（Apache License 2.0）。不是 Mojang 或 Microsoft 的官方产品，也与 PCL 及其作者无关。
    <h4>2. 使用规则</h4>请遵守 Minecraft 最终用户许可协议和各项服务的规则，使用你自己的账户，支持正版游戏。本软件完全免费。
    <h4>3. 第三方内容与服务</h4>游戏文件、模组、整合包等来自第三方，本软件只负责下载和安装，不对其内容负责。
    <h4>4. AI 助手</h4>使用你自己配置的 AI 服务，费用由服务商收取；回答可能不准确。
    <h4>5. 免责声明</h4>按「原样」提供，不附带任何担保。请定期备份存档。
    <h4>6. 协议更新</h4>更新后启动时会请你再次确认。`
  : `
    <h4>1. 我们不收集你的信息</h4>没有账户系统，不收集统计，不上传崩溃报告和文件。
    <h4>2. 保存在你设备上的信息</h4>账户和登录令牌、AI 密钥和聊天记录、设置、游戏文件和存档。
    <h4>3. 会连接的服务</h4>Microsoft 与 Mojang（登录、下载）、下载镜像与加载器仓库、Modrinth、GitHub 与 pixelworld.zhuzhi.site（检查更新、文档）、你配置的 AI 服务商……
    <h4>4. 安卓权限</h4>网络；所有文件访问（只在把游戏放在手机存储时）；安装应用（只在更新启动器时）。`;
}

function body() {
  const phone = S.dev === 'phone';
  switch (S.step) {
    case 0: return `
      <div class="hero">${cube()}
        <h1>欢迎使用 Pixel World</h1>
        <p class="lead">免费、开源的 Minecraft 启动器。花一两分钟完成几项设置，之后都可以在「设置」里改。</p>
        <div class="feats">
          <div class="feat">${svg('layers')}<b>安装与管理</b>原版和各种加载器，一个版本可以装多个实例，模组、存档各管各的。</div>
          <div class="feat">${svg('globe')}<b>模组与资源</b>在启动器里直接找模组、整合包、资源包和光影。</div>
          <div class="feat">${svg('chat')}<b>AI 排障</b>游戏崩了，让 AI 读日志找原因。</div>
        </div>
        <div class="lang">语言 <span class="select">简体中文 ${svg('down')}</span><span style="color:var(--faint);font-size:12px">English 即将支持</span></div>
      </div>`;
    case 1: return `
      <h1>用户协议与隐私说明</h1>
      <p class="lead">继续之前，请阅读并同意下面两份文件。</p>
      <div class="summary"><ul>
        <li>本软件免费开源，按原样提供；不是 Mojang、Microsoft 或 PCL 的官方产品。</li>
        <li>我们不收集你的信息，账户和设置只保存在你的设备上。</li>
        <li>游戏、模组等内容来自第三方，下载时直接连接它们。</li></ul></div>
      <div class="tabs"><span data-tab="0" class="${S.tab === 0 ? 'on' : ''}">用户协议</span><span data-tab="1" class="${S.tab === 1 ? 'on' : ''}">隐私说明</span></div>
      <div class="legal">${legal()}</div>
      <div class="check ${S.agreed ? 'on' : ''}" data-act="agree"><span class="box">${svg('check')}</span>我已阅读并同意《用户协议》和《隐私说明》</div>`;
    case 2: return `
      <h1>外观</h1>
      <p class="lead">选一个顺眼的样子。${phone ? '手机上的「标准」就是原来的首页；背景图片只在「上下」「极简」里显示。' : ''}</p>
      <div class="group">
        <div class="row"><div class="rt">颜色模式<div class="s">启动器界面的明暗</div></div>
          <div class="seg">${['system:跟随系统', 'light:浅色', 'dark:深色'].map((x) => { const [k, v] = x.split(':'); return `<span data-mode="${k}" class="${S.mode === k ? 'on' : ''}">${v}</span>`; }).join('')}</div></div>
        <div class="row"><div class="rt">主题色<div class="s">${S.wall ? '设了背景图片时可以改为跟随背景取色' : '按 Material Design 3 生成整套配色'}</div></div>
          <div class="swatches">${COLORS.map((c, i) => `<span class="sw ${S.color === i ? 'on' : ''}" data-color="${i}" style="background:${c}"></span>`).join('')}</div></div>

      <div class="gtitle">首页布局</div>
      <div class="opts cols3">
        ${[['standard', '标准', '大卡片、公告与快捷按钮、最近游玩'], ['split', '上下', '实例在顶部，开始游戏在底部，中间留给背景'], ['minimal', '极简', '只在底部留一条']].map(([k, t, s]) => `
          <div class="lay ${S.layout === k ? 'on' : ''}" data-layout="${k}">
            <div class="pv ${S.wall && !(phone && k === 'standard') ? 'wall' : ''}">${preview(k)}</div>
            <div class="t">${t}${k === 'split' && S.wall ? ' <span class="tag">推荐</span>' : ''}</div><div class="s">${s}</div></div>`).join('')}
      </div>`;
    case 3: return phone ? `
      <h1>游戏文件放在哪里？</h1>
      <p class="lead">之后可以在「设置 → 游戏管理」里更改。</p>
      <div class="opts">
        <div class="opt ${S.storage === 'shared' ? 'on' : ''}" data-storage="shared"><div class="t">手机存储 <span class="tag">推荐</span></div>
          <div class="s">放在「Pixel World/.minecraft」。卸载或重装启动器后游戏和存档仍然保留，也能用其他应用管理。需要授予「所有文件访问权限」。</div></div>
        <div class="opt ${S.storage === 'internal' ? 'on' : ''}" data-storage="internal"><div class="t">应用内部</div>
          <div class="s">不需要权限，但卸载启动器时游戏和存档会一起删除。</div></div>
      </div>` : `
      <h1>游戏文件夹</h1>
      <p class="lead">游戏、实例、模组和存档都放在这里。之后可以在「设置 → 游戏管理」里添加更多文件夹。</p>
      <div class="opts">
        <div class="opt ${S.folder === 'default' ? 'on' : ''}" data-folder="default"><div class="t">使用默认文件夹 <span class="tag">推荐</span></div>
          <div class="s">C:\\Users\\Steve\\AppData\\Roaming\\Pixel World\\.minecraft</div></div>
        <div class="opt ${S.folder === 'existing' ? 'on' : ''}" data-folder="existing"><div class="t">使用已有的 .minecraft 文件夹</div>
          <div class="s">以前用别的启动器装过游戏？直接选那个文件夹，里面的版本和存档都能用。</div>
          ${S.folder === 'existing' ? '<div class="extra"><span class="path">D:\\Games\\.minecraft</span><button class="btn">选择…</button></div>' : ''}</div>
        <div class="opt ${S.folder === 'pcl' ? 'on' : ''}" data-folder="pcl"><div class="t">从 PCL-CE 导入 <span class="tag gray">检测到 PCL-CE</span></div>
          <div class="s">导入 PCL-CE 的游戏文件夹、账户和启动设置。</div>
          ${S.folder === 'pcl' ? '<div class="extra"><span class="path">D:\\PCL\\.minecraft · 3 个实例 · 2 个账户</span></div>' : ''}</div>
      </div>`;
    case 4: return `
      <h1>下载</h1>
      <p class="lead">游戏和加载器从哪里下载。国内一般镜像更快。</p>
      <div class="opts">
        ${[['auto', '自动选择', '先试镜像，失败或很慢时换官方源', '推荐'], ['bmclapi', 'BMCLAPI 镜像', '国内速度快，由 bangbang93 运营', ''], ['official', '官方源', 'Mojang 和各加载器官方服务器，国外网络更快', '']].map(([k, t, s, tag]) => `
          <div class="opt ${S.source === k ? 'on' : ''}" data-source="${k}"><div class="t">${t}${tag ? ` <span class="tag">${tag}</span>` : ''}</div><div class="s">${s}</div></div>`).join('')}
      </div>`;
    case 5: return `
      <h1>添加账户</h1>
      <p class="lead">玩正版用微软账户；也可以先用离线账户，之后在右上角随时添加。</p>
      <div class="acct">
        <div class="opt" data-acct="ms"><div class="ico">${svg('ms')}</div><div class="t">微软账户</div><div class="s">正版登录，可以进正版服务器</div></div>
        <div class="opt" data-acct="ygg"><div class="ico">${svg('key')}</div><div class="t">外置登录</div><div class="s">LittleSkin 等皮肤站</div></div>
        <div class="opt ${S.account === 'offline-edit' ? 'on' : ''}" data-acct="offline"><div class="ico">${svg('user')}</div><div class="t">离线账户</div><div class="s">起个名字就能玩单机</div></div>
      </div>
      ${S.account === 'offline-edit' ? `<div class="added"><input class="field" id="oname" placeholder="名字（3～16 个字母、数字或下划线）" value="${S.offlineName}"><button class="btn p" data-act="addoffline">添加</button></div>` : ''}
      ${S.account && S.account !== 'offline-edit' ? `<div class="added"><span class="avatar">${S.account[0].toUpperCase()}</span><div style="flex:1"><b>${S.account}</b><div style="color:var(--faint);font-size:12px">离线账户 · 已添加</div></div><a class="btn text" data-act="clearacct">移除</a></div>` : ''}`;
    case 6: return `
      <div class="hero"><div class="doneicon">${svg('check')}</div>
        <h1 style="font-size:${phone ? 20 : 26}px">准备好了</h1>
        <p class="lead">设置都可以之后在「设置」里改。</p>
        <div class="group sum">
          <div class="row"><span class="k">外观</span><span class="v">${{ system: '跟随系统', light: '浅色', dark: '深色' }[S.mode]} · ${{ standard: '标准', split: '上下', minimal: '极简' }[S.layout]}布局${S.wall ? ' · 有背景图片' : ''}</span><a data-go="2">修改</a></div>
          <div class="row"><span class="k">游戏文件夹</span><span class="v">${phone ? (S.storage === 'shared' ? '手机存储' : '应用内部') : { default: '默认文件夹', existing: 'D:\\Games\\.minecraft', pcl: '从 PCL-CE 导入' }[S.folder]}</span><a data-go="3">修改</a></div>
          <div class="row"><span class="k">下载源</span><span class="v">${{ auto: '自动选择', bmclapi: 'BMCLAPI 镜像', official: '官方源' }[S.source]}</span><a data-go="4">修改</a></div>
          <div class="row"><span class="k">账户</span><span class="v">${S.account && S.account !== 'offline-edit' ? S.account + '（离线）' : '还没有添加'}</span><a data-go="5">修改</a></div>
        </div>
        <div class="check ${S.tour ? 'on' : ''}" data-act="tour"><span class="box">${svg('check')}</span>进入后看一遍新手教程（约 1 分钟）</div>
      </div>`;
  }
}

function preview(k) {
  if (k === 'standard') return '<i style="left:6px;top:6px;width:58%;height:44%"></i><i style="right:6px;top:6px;width:30%;height:44%"></i><i class="g" style="left:12px;top:36%;width:18%;height:10%"></i><i style="left:6px;bottom:6px;width:44%;height:30%"></i><i style="left:52%;bottom:6px;width:44%;height:30%"></i>';
  if (k === 'split') return '<i style="left:6px;top:6px;right:6px;height:16%"></i><i style="left:6px;bottom:6px;right:6px;height:18%"></i><i class="g" style="left:9px;bottom:9px;width:22%;height:12%"></i>';
  return '<i style="left:26%;bottom:6px;width:48%;height:18%"></i><i class="g" style="left:54%;bottom:9px;width:17%;height:12%"></i>';
}

function foot() {
  const last = S.step === STEPS.length - 1;
  const back = S.step > 0 ? '<button class="btn" data-act="back">上一步</button>' : '';
  if (S.step === 1) return `<button class="btn text" data-act="exit">不同意并退出</button><span class="grow"></span>${back}<button class="btn p" data-act="next" ${S.agreed ? '' : 'disabled'}>同意并继续</button>`;
  if (S.step === 5) return `${back}<span class="grow"></span><button class="btn text" data-act="next">稍后再说</button><button class="btn p" data-act="next" ${S.account && S.account !== 'offline-edit' ? '' : 'disabled'}>下一步</button>`;
  if (last) return `${back}<span class="grow"></span><button class="btn" data-act="finish">进入启动器</button><button class="btn p" data-act="finish">${svg('rocket')}去安装第一个实例</button>`;
  if (S.step === 0) return `<span class="hint">${S.dev === 'phone' ? '约 1 分钟' : '共 6 步，约 1 分钟'}</span><span class="grow"></span><button class="btn p" data-act="next">开始设置</button>`;
  return `${back}<span class="grow"></span><button class="btn p" data-act="next">下一步</button>`;
}

function render() {
  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <div class="frame ${S.dev}" id="frame"><span class="cutout"></span>
      <div class="winbtns"><span>—</span><span>☐</span><span>✕</span></div>
      <div class="oobe">
        <div class="side">
          <div class="brand">${cube()}<div><b>Pixel World</b><small>首次设置</small></div></div>
          <div class="steps">${stepsHtml()}</div>
          <div class="skip">不想现在设置？<a data-act="skipall">全部用默认</a>（仍需同意协议）</div>
        </div>
        <div class="content">
          <div class="scroll">${body()}</div>
          <div class="foot">${foot()}</div>
        </div>
      </div>
      <div class="toast" id="toast"></div>
    </div>`;
  fit();
}

function fit() {
  const f = document.getElementById('frame');
  const w = S.dev === 'desktop' ? 1100 : 930;
  const h = S.dev === 'desktop' ? 700 : 427;
  const k = Math.min(1, document.getElementById('stage').clientWidth / w);
  f.style.transform = `scale(${k})`;
  f.style.marginLeft = S.dev === 'phone' ? '8px' : '0';
  document.getElementById('stage').style.height = h * k + 'px';
}

function toast(t) {
  const el = document.getElementById('toast');
  el.textContent = t; el.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('show'), 1600);
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-dev],[data-go],[data-act],[data-tab],[data-mode],[data-color],[data-layout],[data-folder],[data-storage],[data-source],[data-acct]');
  if (!t) return;
  const d = t.dataset;
  if (d.dev) { S.dev = d.dev; document.querySelectorAll('[data-dev]').forEach((b) => b.classList.toggle('on', b === t)); return render(); }
  if (d.go !== undefined) { const i = +d.go; if (i > 1 && !S.agreed) return toast('请先同意用户协议'); S.step = i; return render(); }
  if (d.tab !== undefined) S.tab = +d.tab;
  if (d.mode) S.mode = d.mode;
  if (d.color !== undefined) S.color = +d.color;
  if (d.layout) S.layout = d.layout;
  if (d.folder) S.folder = d.folder;
  if (d.storage) S.storage = d.storage;
  if (d.source) S.source = d.source;
  if (d.acct) {
    if (d.acct === 'offline') S.account = 'offline-edit';
    else return toast(d.acct === 'ms' ? '这里会打开微软登录（设备代码）' : '这里会打开外置登录');
  }
  switch (d.act) {
    case 'agree': S.agreed = !S.agreed; break;
    case 'next': if (S.step === 5 && S.account === 'offline-edit') S.account = null; S.step = Math.min(S.step + 1, STEPS.length - 1); break;
    case 'back': S.step = Math.max(S.step - 1, 0); break;
    case 'exit': return toast('启动器会退出');
    case 'wall': S.wall = !S.wall; if (S.wall) S.layout = 'split'; break;
    case 'addoffline': {
      const v = document.getElementById('oname').value.trim();
      if (!/^\w{3,16}$/.test(v)) return toast('名字需要 3～16 个字母、数字或下划线');
      S.account = v; break;
    }
    case 'clearacct': S.account = null; break;
    case 'tour': S.tour = !S.tour; break;
    case 'skipall': if (!S.agreed) { S.step = 1; render(); return toast('先同意用户协议，其他用默认'); } S.step = 6; break;
    case 'finish': return toast(S.tour ? '进入主界面，接着开始新手教程' : '进入主界面');
  }
  render();
});
document.addEventListener('input', (e) => { if (e.target.id === 'oname') S.offlineName = e.target.value; });
window.addEventListener('resize', fit);
render();
</script>
</body>
</html>
