  .start { width: 200px; height: 48px; border-radius: 24px; background: #ffd9bb; color: #3a1d06; display: flex; align-items: center; gap: 12px; padding: 0 20px; cursor: pointer; flex: none; }

  .dialog { width: 460px; border-radius: 22px; padding: 22px 24px 18px; background: #2a211c; box-shadow: 0 20px 60px rgba(0,0,0,.6); }

  .field { border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); padding: 8px 12px; margin-top: 12px; }
  .field small { display: block; font-size: 11.5px; color: #b5a79c; } .field input { all: unset; width: 100%; font-size: 14px; color: #fff; }

  .mark .chg-t { position: relative; }
  .mark .chg-t::after { content: "改"; position: absolute; top: -7px; right: -7px; font-size: 10px; background: #5fd3ff; color: #00222e; border-radius: 6px; padding: 0 4px; font-weight: 700; line-height: 15px; }
</style>

    <div class="sect">接收</div><div class="card" style="padding:14px"><div class="small muted" style="margin-bottom:10px">开始接收后，在另一台设备上输入下面显示的地址和配对码。</div><span class="btn fill">${ic('dl2', 16)}开始接收</span></div>
    <div class="sect">发送</div><div class="card" style="padding:14px">
      <span class="sel chg-t" style="width:100%;justify-content:space-between">${insId}${ic('chev', 14)}</span>
      <div style="margin:12px 0 8px"><span class="seg"><span class="${whole ? '' : 'on'}">选择内容</span><span class="${whole ? 'on' : ''} chg-t">整个实例</span></span></div>
      ${whole ? '<div class="small muted">对方会得到一个完整的新实例。</div>' : `<div class="row" style="flex-wrap:wrap;gap:6px">${chips.map(c => `<span class="chip ${onSet.includes(c) ? 'on' : ''}">${c}${c === '存档' && pre?.world ? `：${pre.world}` : ''}</span>`).join('')}</div>`}
      <div class="row" style="margin-top:14px;gap:10px"><div class="field grow" style="margin:0"><small>对方地址</small><input></div><div class="field" style="margin:0;width:180px"><small>配对码</small><input></div></div>
      <div style="margin-top:12px"><span class="btn fill">${ic('send', 16)}发送</span></div></div>`;
};
TP.server = () => `<div class="row"><div class="field grow" style="margin:0"><small>服务器地址</small><input value="mc.hypixel.net"></div><span class="btn fill">查询</span></div>
  <div class="hint" style="margin-top:10px">实例里已添加的服务器，在「实例详情 → 服务器」直接显示在线人数和延迟。</div>`;
TP.lobby = () => `<div class="card" style="padding:30px;text-align:center">${ic('lobby', 32)}<div style="margin-top:8px">联机大厅（开发中）</div></div>`;
TP.diag = () => {
  const r = nav.diag;
  return `${r ? `<div class="banner" style="margin-bottom:12px;background:rgba(220,80,60,.18);box-shadow:inset 0 0 0 1px rgba(220,80,60,.5)">${ic('bug', 18)}<div class="grow"><b>内存不足</b>（最近一次游戏：${cur().id}）<div class="small muted">游戏可用的内存不够。可以加大内存，或减少模组、光影与高清材质。</div></div>
    <span class="btn sm fill chg chg-t" onclick="openDetail(S.current,'setup')">去实例设置</span><span class="btn sm out" onclick="askAI()">问 AI</span></div>` : ''}
    <div class="card">${[['history', '最近一次游戏', '分析本次打开启动器后最近一次运行的游戏', '分析'], ['log', '日志文件', '选择崩溃报告或日志文件', '选择'], ['list', '粘贴日志', '粘贴别人发给你的崩溃报告或日志', '粘贴']].map(t =>
    `<div class="li">${ic(t[0])}<div class="grow"><div class="t">${t[1]}</div><div class="s">${t[2]}</div></div><span class="btn sm tonal" onclick="nav.diag=1;render()">${t[3]}</span></div>`).join('')}</div>`;
};
TP.dl = () => `<div class="field" style="margin-top:0"><small>下载地址</small><input placeholder="https://"></div><div class="row" style="margin-top:12px"><span class="small muted grow">保存位置：开始下载时选择</span><span class="btn fill">${ic('dl2', 16)}开始下载</span></div>`;
TP.skin = () => `<div class="row"><div class="field grow" style="margin:0"><small>正版玩家名</small><input value="Notch"></div><span class="btn fill">获取</span></div><div class="hint" style="margin-top:10px">查看和下载其他正版玩家的皮肤与头像。</div>`;
TP.ach = () => `<div class="field" style="margin-top:0"><small>标题</small><input value="进度达成！"></div><div class="field"><small>内容</small><input value="钻石！"></div><div style="margin-top:12px"><span class="btn fill">生成</span></div>`;
TP.luck = () => `<div class="card" style="padding:26px;text-align:center"><div class="muted">Steve 的今日人品</div><div style="font-size:56px;font-weight:800;color:#ffb77c">87</div><div class="small muted">每人每天固定</div></div>
  <div class="card li chg" style="margin-top:10px">${ic('rocket')}<div class="grow"><div class="t">启动次数</div><div class="s">已经通过启动器启动了 128 次游戏</div></div></div>
  <div class="hint" style="margin-top:8px">原来的「百宝箱」拆掉：今日人品、启动次数放这里；清理游戏垃圾去「设置 → 游戏管理」；桌面快捷方式去「设置 → 其他」。</div>`;

// ---------------- 设置 ----------------
const SETS = [
  ['游戏', [['launch', 'rocket', '启动'], ['java', 'java', 'Java'], ['manage', 'folder', '游戏管理']]],
  ['启动器', [['look', 'palette', '个性化'], ['other', 'sliders', '其他']]],
  ['AI', [['model', 'sparkle', '模型与接口'], ['aitools', 'puzzle', '工具与服务'], ['ws', 'globe', '工作区与联网']]],
  ['关于', [['about', 'info', '关于与致谢'], ['docs', 'book', '使用文档']]],
];
PAGES.settings = () => {
  const sec = nav.sec || 'launch';
  return `<div class="side glass">${SETS.map(([g, items]) => `<div class="gt">${g}</div>${items.map(([k, i, t]) =>
    `<div class="it ${k === sec ? 'on' : ''} ${k === 'docs' ? 'chg' : ''}" onclick="nav.sec='${k}';render()">${ic(i, 17)}${t}</div>`).join('')}`).join('')}</div>
    <div class="content glass scroll">${(SP[sec] || SP.stub)()}</div>`;
};
const SP = {};
const srow = (icn, t, s, right, chg) => `<div class="li ${chg ? 'chg' : ''}">${ic(icn)}<div class="grow"><div class="t ${chg ? 'chg-t' : ''}" style="display:inline-block">${t}</div><div class="s">${s}</div></div>${right}</div>`;
SP.launch = () => `<div class="sect">启动</div><div class="card">
  ${srow('folder', '实例隔离', '每个实例使用自己的游戏目录（存档、模组、配置互不影响）', `<span class="sel" onclick="openMenu('iso',event)">可装模组的实例 ${ic('chev', 14)}</span>`, 1)}
  ${srow('sliders', '游戏内存', '自动分配（约 4 GB）', `<span class="seg"><span class="on">自动</span><span>自定义</span></span>`)}
  ${srow('image', '窗口大小', '默认', `<span class="sel">默认 ${ic('chev', 14)}</span>`)}</div>
  <div class="hint" style="margin-top:8px">这里是全局设置；每个实例可以在「实例设置」里单独改，或者跟随这里。</div>`;
SP.java = () => `<div class="sect">Java</div><div class="card">${srow('java', 'Java', '自动选择：按实例的游戏版本挑合适的 Java', `<span class="sel">自动 ${ic('chev', 14)}</span>`)}</div>`;
SP.manage = () => `<div class="sect">游戏文件夹</div><div class="card">${srow('folder', '游戏文件夹', 'D:\\PixelsWorld\\.minecraft 等 2 个', `<span class="btn sm tonal">管理</span>`)}</div>
  <div class="sect">维护</div><div class="card">${srow('broom', '清理游戏垃圾', '删除日志、崩溃报告与解压出的本地库，不影响存档和模组；当前约 1.2 GB', `<span class="btn sm tonal" onclick="toast('已清理 1.2 GB')">清理</span>`, 1)}</div>`;
SP.look = () => `<div class="sect">个性化</div><div class="card">${srow('palette', '颜色模式', '启动器界面的明暗模式', `<span class="seg"><span>跟随系统</span><span>浅色</span><span class="on">深色</span></span>`)}
  ${srow('image', '背景图片', '显示在整个窗口后面，界面面板会变成毛玻璃', `<span class="btn sm tonal">换一张…</span>`)}</div>`;
SP.other = () => `<div class="sect">更新</div><div class="card">${srow('refresh', '更新通道', '正式版最稳定；Nightly 为 main 分支的每次更新', `<span class="sel">正式版 ${ic('chev', 14)}</span>`)}</div>
  <div class="sect">系统</div><div class="card">${srow('shortcut', '创建桌面快捷方式', '在桌面创建启动器的快捷方式', `<span class="btn sm tonal" onclick="toast('已创建')">创建</span>`, 1)}</div>`;
SP.docs = () => `<div class="row" style="gap:12px;align-items:flex-start"><div class="card" style="width:170px;padding:8px">${['快速开始', '实例与游戏版本', '模组与资源', '联机', '常见问题'].map((t, k) => `<div class="li" style="padding:8px 10px;${k === 1 ? 'color:#ffd2a8;font-weight:600' : ''}">${t}</div>`).join('')}</div>
  <div class="grow card" style="padding:16px 18px;line-height:1.8;font-size:13.5px"><b style="font-size:16px">实例与游戏版本</b><br><b>游戏版本</b>是 Minecraft 本身的版本号，例如 1.20.1。<br><b>实例</b>是你装好的一份游戏：一个游戏版本 + 加载器 + 自己的模组、存档和设置。同一个游戏版本可以装多个实例，例如「1.20.1 生存」和「1.20.1 建筑」互不影响。</div></div>
  <div class="hint" style="margin-top:8px">使用文档从「工具」移到这里。</div>`;
SP.stub = () => `<div class="card" style="padding:28px;text-align:center" class="muted">（这一页内容不变）</div>`;
PAGES.ai = () => `<div class="content glass" style="display:flex;flex-direction:column">
  <div class="grow scroll">${nav.ask ? `<div style="display:flex;justify-content:flex-end"><div class="card" style="padding:10px 14px;max-width:70%;background:rgba(242,160,58,.25)">游戏崩溃了，帮我看看是什么原因<div class="small muted chg chg-t" style="margin-top:6px;display:inline-block">📎 已附带：${cur().id} 的崩溃报告与最近日志</div></div></div>
  <div class="card" style="padding:10px 14px;max-width:75%;margin-top:10px">看了崩溃报告，是<b>内存不足</b>（java.lang.OutOfMemoryError）。这个实例装了 ${cur().mods} 个模组，当前分配约 2 GB，建议在实例设置里把内存改为 6 GB……</div>` : `<div class="muted" style="text-align:center;margin-top:120px">有什么可以帮你？</div>`}</div>
  <div class="input card" style="margin-top:10px">输入问题…</div></div>`;
PAGES.history = () => `<div class="content glass scroll"><div class="card">${S.history.map(h => `<div class="li">${ic('history')}<div class="grow"><div class="t">${h.t}</div><div class="s">${h.s}</div></div></div>`).join('')}</div>
  <div class="hint" style="margin-top:8px">原来在「工具 → 任务历史」，现在从顶栏的任务面板进来。</div></div>`;

// ---------------- 动作 ----------------
function sendLan(i, what, world) { lanPreset = { i, what, world }; go({ page: 'tools', sec: 'lan' }); }
function launch(i) { if (i != null) S.current = i; toast(`正在启动 ${cur().id}…（示意）`); render(); }
function crash() { dialog = { kind: 'crash' }; renderLayer(); }
function askAI() { dialog = null; root('ai', { ask: 1 }); }
function openMenu(kind, ev) { menu = menu?.kind === kind ? null : { kind }; ev?.stopPropagation(); renderLayer(); }

function renderLayer() {
  const l = document.getElementById('layer');
  const keepToast = l.querySelector('.toast')?.outerHTML || '';
  let h = '';
  if (menu?.kind === 'switch') {
    h += `<div class="menu" style="left:250px;top:110px"><div class="mh">切换当前实例</div>${S.instances.map((x, i) => `<div class="mi" onclick="menu=null;setCurrent(${i})">${i === S.current ? ic('check', 16) : '<span style="width:16px"></span>'}<div class="grow"><div>${x.id}</div><div class="small faint">${LOADER[x.loader]} ${x.game} · ${x.mods} 个模组</div></div></div>`).join('')}
      <hr><div class="mi chg" onclick="go({page:'instances'})">${ic('list', 16)}管理全部实例<span class="grow"></span>${ic('right', 14)}</div></div>`;
  }
  if (menu?.kind === 'tasks') {
    h += `<div class="menu" style="right:240px;top:50px;width:320px"><div class="mh">正在进行</div>${S.tasksRunning.length ? S.tasksRunning.map(t => `<div class="mi" style="display:block">${t.t}<div class="bar2"><i style="width:${t.p}%"></i></div></div>`).join('') : '<div class="mi faint">没有正在进行的任务</div>'}
      <hr><div class="mh chg-t" style="display:inline-block">最近完成</div>${S.history.slice(0, 3).map(t => `<div class="mi">${ic('check', 16)}<div class="grow"><div>${t.t}</div><div class="small faint">${t.s}</div></div></div>`).join('')}
      <hr><div class="mi chg" onclick="go({page:'history'})">${ic('history', 16)}查看全部历史<span class="grow"></span>${ic('right', 14)}</div></div>`;
  }
  if (menu?.kind === 'target') {
    h += `<div class="menu" style="left:300px;top:250px"><div class="mh">安装到</div>${S.instances.map((x, i) => `<div class="mi" onclick="menu=null;S.current=${i};render()">${i === S.current ? ic('check', 16) : '<span style="width:16px"></span>'}${x.id}<span class="grow"></span><span class="small faint">${x.game}</span></div>`).join('')}</div>`;
  }
  if (menu?.kind === 'iso') {
    h += `<div class="menu chg" style="right:40px;top:180px">${['关闭', '可装模组的实例', '非正式版', '可装模组的实例与非正式版', '所有实例'].map(o => `<div class="mi" onclick="menu=null;renderLayer()">${o === '可装模组的实例' ? ic('check', 16) : '<span style="width:16px"></span>'}${o}</div>`).join('')}</div>`;
  }
  if (dialog?.kind === 'new') {
    const d = dialog, name = `${d.game}-${LOADER[d.loader].replace(/\s/g, '')}`;
    const dup = S.instances.some(x => x.game === d.game && x.loader === d.loader);
    h += `<div class="scrim" onclick="if(event.target===this){dialog=null;renderLayer()}"><div class="dialog"><h3 class="chg-t" style="display:inline-block">安装新实例</h3>
      <div class="small muted">游戏版本 ${d.game}</div>
      <div style="margin-top:14px" class="seg">${['vanilla', 'fabric', 'forge', 'neo'].map(k => `<span class="${k === d.loader ? 'on' : ''}" onclick="dialog.loader='${k}';renderLayer()">${LOADER[k]}</span>`).join('')}</div>
      <div class="field"><small>实例名称</small><input id="nm" value="${dup ? name + ' (2)' : name}"></div>
      ${dup ? `<div class="small chg" style="margin-top:8px;color:#ffd2a8">已经有一个 ${d.game} ${LOADER[d.loader]} 的实例，这会再装一个独立的实例，存档和模组互不影响。</div>` : ''}
      <div class="acts"><span class="btn out" onclick="dialog=null;renderLayer()">取消</span><span class="btn fill" onclick="doNew()">安装</span></div></div></div>`;
  }
  if (dialog?.kind === 'crash') {
    h += `<div class="scrim"><div class="dialog"><h3>游戏崩溃了</h3><div class="small muted">${cur().id} · 退出代码 -1</div>
      <div class="card" style="padding:10px 12px;margin-top:12px;font-size:13px">${ic('bug', 16)} 可能的原因：<b>内存不足</b><div class="small muted" style="margin-top:4px">游戏可用的内存不够，可以在实例设置里加大内存。</div></div>
      <div class="acts"><span class="btn out" onclick="dialog=null;renderLayer()">关闭</span><span class="btn out">查看日志</span>
      <span class="btn tonal chg chg-t" onclick="dialog=null;root('tools',{sec:'diag',diag:1})">详细分析</span><span class="btn fill chg chg-t" onclick="askAI()">${ic('sparkle', 16)}问 AI</span></div></div></div>`;
  }
  l.innerHTML = h + keepToast;
}
function doNew() {
  const d = dialog, name = document.getElementById('nm').value.trim() || d.game;
  S.instances.push({ id: name, loader: d.loader, game: d.game, mods: 0, played: '从未', folder: 0 });
  S.tasksRunning.push({ t: `安装 ${name}`, p: 45 });
  dialog = null; toast(`开始安装 ${name}，进度见顶栏任务面板`); render();
  setTimeout(() => { const t = S.tasksRunning.shift(); if (t) S.history.unshift({ t: t.t, s: '完成 · 刚刚' }); toast(`${name} 安装完成，可以在「实例」里找到`); render(); }, 2500);
}
document.addEventListener('click', (e) => { if (menu && !e.target.closest('.menu')) { menu = null; renderLayer(); } });

// ---------------- 改动导览 ----------------
const JUMPS = [
  ['1', '名词：实例 / 游戏版本', () => root('home')],
  ['2', '切换实例 → 管理全部实例', () => { root('home'); setTimeout(() => openMenu('switch'), 0); }],
  ['2', '实例列表', () => root('home') || go({ page: 'instances' })],
  ['2', '实例详情（中心）', () => root('home') || openDetail(S.current, 'overview')],
  ['3', '工具页重新分组', () => root('tools')],
  ['3', '任务历史 → 顶栏任务面板', () => { root('home'); setTimeout(() => openMenu('tasks'), 0); }],
  ['3', '清理垃圾 → 设置', () => root('settings', { sec: 'manage' })],
  ['3', '使用文档 → 设置', () => root('settings', { sec: 'docs' })],
  ['3', '崩溃提示直达分析 / AI', () => crash()],
  ['3', '存档直接发送', () => root('home') || openDetail(S.current, 'saves')],
  ['4', '实例里添加模组', () => root('home') || openDetail(S.current, 'mods')],
  ['6', '跟随全局显示当前值', () => root('home') || openDetail(S.current, 'setup')],
];
function renderJump() {
  document.getElementById('jump').innerHTML = JUMPS.map((j, k) => `<button onclick="JUMPS[${k}][2]()"><b>${j[0]}</b>${j[1]}</button>`).join('');
}
document.getElementById('note').innerHTML = `上面的按钮直接跳到每处改动；窗口里可以随便点（侧栏、标签、按钮、下拉都能用）。<b>蓝色虚线</b>标的是改动的地方。数字对应讨论里的条目：1 名词、2 实例中心、3 工具页整理、4 实例里加模组、6 全局与实例设置。`;

// ---------------- 缩放 ----------------
function fit() { const w = document.getElementById('stage').clientWidth, k = Math.min(1, w / 1100); const win = document.getElementById('win'); win.style.transform = `scale(${k})`; document.getElementById('stage').style.height = 700 * k + 'px'; }
addEventListener('resize', fit);
resetAll(); fit();
</script>
</body>
</html>
