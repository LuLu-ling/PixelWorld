name: pcl_pw
description: "Pixel World"
publish_to: 'none'

# 版本名 + 构建号：构建号是安卓的 versionCode，每次发布都要增加
version: 0.3.3+26

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  window_manager: ^0.6.0
  url_launcher: ^6.3.3
  material_color_utilities: any
  path: ^1.9.1
  path_provider: ^2.1.6
  crypto: ^3.0.8
  archive: ^4.6.0
  yaml: ^3.1.4
  yaml_edit: ^2.2.4
  win32: ^6.4.0
  ffi: ^2.2.0
  file_selector: ^1.1.0
  cryptography: ^2.9.0
  flutter_svg: ^2.3.2
  flutter_markdown_plus: ^1.0.12
  html: ^0.15.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 规则在 analysis_options.yaml 中启用
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 图标源图在 assets/icon/source/，只供 tool/icons 生成图标用，不打包
  assets:
    - assets/icon/icon.png
    # Apple 芯片的 Mac 上运行 1.13～1.18 用的 GLFW（lib/core/mac_glfw.dart）
    - assets/macos/libglfw.3.dylib
    # 首页的更新日志（与发布说明同一份文件，见 lib/core/changelog.dart）
    - release-notes/
