# 构建并发布 Windows、安卓与 macOS 版
# - 推送到 main：更新 nightly 预发布（每次替换为最新构建）
# - 推送 v* 标签：发布正式版；标签带 "-"（如 v0.3.0-beta）时标为预发布
# macOS 版没有 Apple 开发者签名与公证（临时签名），用户首次打开时需要在系统设置中允许
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
  FLUTTER_VERSION: 3.47.9
  # 写进程序里的构建信息，供启动器的更新功能判断通道与版本
  PCLPW_COMMIT: ${{ github.sha }}
  PCLPW_CHANNEL: ${{ github.ref_type != 'tag' && 'nightly' || contains(github.ref_name, '-') && 'preview' || 'stable' }}

jobs:
  # 静态分析与自动化测试，失败时不构建、不发布。
  # 需要真实游戏环境的 test/manual/ 没有设置环境变量时会自动跳过
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # window_manager 依赖的 cnativeapi 在测试时会编译本地代码，需要 GTK 3、X11、Xi 的开发包
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev pkg-config
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        run: |
          flutter pub get
          dart run tool/build_installer.dart
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*-setup.exe
            dist/*-portable.zip

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # 没有配置签名密钥时用调试签名（每次构建的签名不同，无法覆盖安装）
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "PCLPW_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::没有配置 ANDROID_KEYSTORE_BASE64，APK 使用调试签名"
          fi
      - name: Build
        env:
          PCLPW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PCLPW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PCLPW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons             --dart-define=PCLPW_COMMIT="$PCLPW_COMMIT" --dart-define=PCLPW_CHANNEL="$PCLPW_CHANNEL"
          version=$(sed -n 's/^version:[[:space:]]*\([0-9.]*\).*/\1/p' pubspec.yaml)
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/PCL.PW-$version-android-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        run: |
          flutter pub get
          flutter build macos --release --dart-define=PCLPW_COMMIT="$PCLPW_COMMIT" --dart-define=PCLPW_CHANNEL="$PCLPW_CHANNEL"
          version=$(sed -n 's/^version:[[:space:]]*\([0-9.]*\).*/\1/p' pubspec.yaml)
          app=build/macos/Build/Products/Release/PCL.PW.app
          # 没有开发者证书：整个应用重新做一次临时签名，保证各个框架的签名一致
          codesign --force --deep --sign - "$app"
          # 安装镜像：PCL.PW.app 与「应用程序」文件夹的快捷方式，拖进去即可安装
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage" dist
          cp -R "$app" "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "PCL.PW" -srcfolder "$stage" -ov -format UDZO "dist/PCL.PW-$version-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  # Linux 版还在测试：只在 nightly 构建，正式标签不发布。
  # cnativeapi 需要 glib 2.74+ 的 G_CONNECT_DEFAULT，使用 Ubuntu 24.04 构建，
  # 兼容 glibc 2.39 及以上的发行版。
  linux:
    needs: check
    if: ${{ github.ref_type == 'branch' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libx11-dev libxi-dev
      - name: Build
        run: |
          flutter pub get
          flutter build linux --release --dart-define=PCLPW_COMMIT="$PCLPW_COMMIT" --dart-define=PCLPW_CHANNEL="$PCLPW_CHANNEL"
          version=$(sed -n 's/^version:[[:space:]]*\([0-9.]*\).*/\1/p' pubspec.yaml)
          stage="$RUNNER_TEMP/PCL.PW"
          mkdir -p "$stage" dist
          cp -R build/linux/x64/release/bundle/. "$stage/"
          tar -C "$RUNNER_TEMP" -czf "dist/PCL.PW-$version-linux-x64.tar.gz" PCL.PW
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*-linux-x64.tar.gz

  publish:
    needs: [windows, android, macos, linux]
    # macOS 或 Linux 构建失败时仍然发布 Windows 与安卓版
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_RESULT: ${{ needs.linux.result }}
        run: |
          version=$(sed -n 's/^version:[[:space:]]*\([0-9.]*\).*/\1/p' pubspec.yaml)
          sha=${GITHUB_SHA::7}
          about="本软件是第三方基于 PCL 二次创作的产物，与 PCL 及其作者无关，请勿就本软件的问题打扰 PCL 作者。"
          downloads=$'- Windows：安装包（`*-setup.exe`）或便携版（`*-portable.zip`）\n- 安卓：`*-android-arm64.apk`，需要 Android 8.0 及以上、64 位 ARM 处理器\n- macOS：`*-macos.dmg`，需要 macOS 12 及以上，Apple 芯片与 Intel 通用。没有经过 Apple 公证，首次打开时如果提示无法验证开发者，请到「系统设置 → 隐私与安全性」中点「仍要打开」'
          if [ "$LINUX_RESULT" = "success" ]; then
            downloads+=$'\n- Linux（测试版）：`*-linux-x64.tar.gz`，需要 Ubuntu 24.04 及以上（glibc 2.39+），解压后运行 `PCL.PW/pcl_pw`'
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            # 更新说明写在 release-notes/<标签>.md 中，没有时只写下载说明
            if [ -f "release-notes/$tag.md" ]; then
              notes=$(printf '%s\n\n## 下载\n\n%s\n\n%s\n' "$(cat "release-notes/$tag.md")" "$downloads" "$about")
            else
              notes=$(printf '%s\n\n%s\n' "$downloads" "$about")
            fi
            flags=(--title "PCL.PW $tag" --notes "$notes" --verify-tag)
            case "$tag" in *-*) flags+=(--prerelease) ;; *) flags+=(--latest) ;; esac
            gh release delete "$tag" --yes 2>/dev/null || true
            gh release create "$tag" "${flags[@]}" dist/*
          else
            # 文件名标明 nightly 与提交号，避免和正式版混淆
            for f in dist/PCL.PW-"$version"-*; do mv "$f" "${f/PCL.PW-$version-/PCL.PW-nightly-$sha-}"; done
            notes=$(printf '自动构建的测试版，来自 main 分支的 %s，可能不稳定。\n\n%s\n\n%s\n' "$GITHUB_SHA" "$downloads" "$about")
            gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
            gh release create nightly --prerelease --target "$GITHUB_SHA" \
              --title "PCL.PW Nightly ($sha)" --notes "$notes" dist/*
          fi
      # 更新启动器的更新接口：官网（site 分支）的 docs/api/v1/update.json。
      # 公告 notices.json 在 site 分支上手动维护，这里不改动
      - name: Update API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" > "$RUNNER_TEMP/releases.json"
          python3 tool/update_api.py "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/update.json"
          git fetch --depth=1 origin site
          git worktree add "$RUNNER_TEMP/site" FETCH_HEAD
          cd "$RUNNER_TEMP/site"
          mkdir -p docs/api/v1
          cp "$RUNNER_TEMP/update.json" docs/api/v1/update.json
          git add docs/api/v1/update.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "更新接口：${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
          git push origin HEAD:site
          # 用 GITHUB_TOKEN 推送不一定触发 Pages 构建，主动请求一次
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null || true
