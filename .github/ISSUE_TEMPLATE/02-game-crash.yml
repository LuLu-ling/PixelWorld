name: 游戏崩溃
description: 启动器报错、游戏闪退、加载世界时崩溃，或安卓上黑屏、渲染异常。
title: "[崩溃]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        崩溃问题通常需要日志才能定位。提交前请先看看[常见问题与排错](https://pcl.pw.zhuzhi.site/docs/troubleshooting.html)和[已有 Issues](https://github.com/zhuzhi-09/PCL.PW/issues?q=is%3Aissue+)。
        如果游戏根本启动不了，请优先用「启动器 Bug」表单；如果是游戏运行中崩溃，用这个表单。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      description: 崩溃问题缺少日志时基本无法处理，请务必附上。
      options:
        - label: 我已经搜索过 [Issues](https://github.com/zhuzhi-09/PCL.PW/issues?q=is%3Aissue+)，没有找到相同的崩溃。
          required: true
        - label: 我使用的是最新版本（正式版或 Nightly），并且已经用最新版本复现过。
          required: true
        - label: 我确认崩溃可以复现；无法复现的部分已经在描述里说明。
          required: true
        - label: 我附上了完整的崩溃报告或日志，并确认内容真实、没有提交未经验证的 AI 生成内容。
          required: true

  - type: dropdown
    id: ai-usage
    attributes:
      label: AI 使用情况
      description: 使用生成式 AI 写这个 Issue 不是违规，但需要说明，并自行核对内容。
      options:
        - 未使用
        - 仅用于翻译或润色
        - 用于分析、起草或整理，已人工核对
    validations:
      required: true

  - type: textarea
    id: ai-details
    attributes:
      label: AI 工具与核对方式
      description: 使用了 AI 时填写工具、模型和用途；未使用填「无」。
      placeholder: |
        工具与模型：
        用途：
        核对方式：
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 系统
      options:
        - Windows
        - Android
        - macOS
        - Linux
        - 其他
    validations:
      required: true

  - type: input
    id: launcher-version
    attributes:
      label: 启动器版本
      description: 在「设置 → 关于」或关于页查看；Nightly 请写提交号。
      placeholder: 例如 0.3.4，或 Nightly 8fc9de8
    validations:
      required: true

  - type: input
    id: game-version
    attributes:
      label: 游戏版本与加载器
      description: 例如 1.20.1 Fabric 0.16.9、1.12.2 Forge 14.23.5.2860、原版 1.21.4。
      placeholder: 1.20.1 + Fabric 0.16.9
    validations:
      required: true

  - type: dropdown
    id: mods
    attributes:
      label: 模组情况
      options:
        - 原版，没有装模组
        - 少量模组
        - 大型整合包
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: 崩溃发生在什么时候
      options:
        - 启动器报错，游戏窗口没有出现
        - 游戏窗口出现后立即闪退
        - 加载器 / 模组加载阶段崩溃
        - 加载世界或进入服务器时崩溃
        - 游戏运行一段时间后崩溃
        - 安卓黑屏、花屏或渲染异常
        - 其他
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 崩溃前你在做什么？有没有报错弹窗或提示？
      placeholder: 我在……的时候崩溃了，启动器提示……
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 写出能稳定重现崩溃的最少步骤；如果只是偶尔发生，也请说明。
      placeholder: |
        1. 启动版本……
        2. 进入世界……
        3. 走到……后崩溃
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 崩溃报告 / 日志 / 截图
      description: 请附上 `crash-reports` 里的崩溃报告、`logs/latest.log`，或从「设置 → 关于 → 导出日志」导出的 ZIP。可以直接把文件拖进来。
      placeholder: 点击这里后把崩溃报告、latest.log 或导出的日志 ZIP 拖进来。
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 内存设置、Java 版本、渲染器（安卓）、最近安装或更新的模组等。
      placeholder: 其他可能有用的信息……
    validations:
      required: false
